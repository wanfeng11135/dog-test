<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐶 小狗人格测试</title>
    <style>
        :root {
            --pink: #5b9bff;
            --peach: #7fb8ff;
            --sky: #a8d0ff;
            --mint: #a8e6cf;
            --text: #3b5575;
            --card: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            background: linear-gradient(135deg, #e0f0ff 0%, #eaf6ff 45%, #d4e6ff 100%);
            min-height: 100vh;
            color: var(--text);
            padding: 20px 16px 210px;
            -webkit-tap-highlight-color: transparent;
        }

        .wrap {
            max-width: 620px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 背景装饰：爪印与小花 */
        .bg-decor {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .deco {
            position: absolute;
            line-height: 1;
            user-select: none;
            animation: floaty 5s ease-in-out infinite;
        }

        .deco.paw {
            color: #ff7fb2;
            opacity: 0.34;
        }

        .deco.paw svg {
            display: block;
            width: 1em;
            height: 1em;
        }

        .deco.flower {
            opacity: 0.16;
        }

        /* 底部草坪与玩耍的小狗 */
        .grass {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 130px;
            background: linear-gradient(180deg, #8bd06a 0%, #5cb34a 100%);
            z-index: 0;
            pointer-events: none;
        }

        .grass::before {
            content: "";
            position: absolute;
            top: -18px;
            left: 0;
            width: 100%;
            height: 18px;
            background-image: radial-gradient(circle at 16px 18px, #8bd06a 16px, transparent 17px);
            background-size: 32px 18px;
            background-repeat: repeat-x;
        }

        @media (max-width: 480px) {
            .grass { height: 104px; }
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-10px) rotate(var(--rot, 0deg)); }
        }

        header {
            text-align: center;
            margin: 16px 0 24px;
        }

        header .paw {
            font-size: 44px;
            display: block;
            animation: bounce 1.6s infinite;
        }

        header h1 {
            font-size: 1.7rem;
            margin-top: 6px;
            color: #3a5a85;
        }

        header p {
            font-size: 0.95rem;
            color: #a07d9a;
            margin-top: 6px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* 进度条 */
        .progress-box {
            position: sticky;
            top: 10px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 999px;
            padding: 10px 14px;
            box-shadow: 0 4px 16px rgba(91, 155, 255, 0.18);
            margin-bottom: 24px;
            z-index: 10;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #a07d9a;
        }

        .progress-track {
            height: 14px;
            background: #e4eefb;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--pink), var(--peach), var(--sky));
            border-radius: 999px;
            transition: width 0.35s ease;
        }

        /* 题目卡片 */
        .question {
            background: var(--card);
            border-radius: 20px;
            padding: 20px 18px;
            margin-bottom: 18px;
            box-shadow: 0 6px 20px rgba(91, 155, 255, 0.12);
            animation: fadeIn 0.4s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question .q-title {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #3a5a85;
            margin-bottom: 14px;
        }

        .q-title .num {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            line-height: 26px;
            text-align: center;
            background: var(--pink);
            color: #fff;
            border-radius: 50%;
            font-size: 0.9rem;
        }

        .option {
            display: block;
            width: 100%;
            text-align: left;
            background: #eef4fc;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font-size: 0.98rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .option:hover {
            background: #e2edfb;
        }

        .option .tag {
            display: inline-block;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            border-radius: 50%;
            background: #fff;
            color: var(--pink);
            font-weight: 700;
            font-size: 0.8rem;
            margin-right: 8px;
        }

        .option.selected {
            background: #eaf2ff;
            border-color: var(--pink);
            color: #2f6fd0;
            font-weight: 600;
        }

        .option.selected .tag {
            background: var(--pink);
            color: #fff;
        }

        /* 结果卡片 */
        .result {
            display: none;
            background: var(--card);
            border-radius: 24px;
            padding: 32px 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(91, 155, 255, 0.18);
            margin-top: 8px;
            animation: popIn 0.5s ease both;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            70% { transform: scale(1.04); }
            100% { opacity: 1; transform: scale(1); }
        }

        .result.show {
            display: block;
        }

        .result .emoji {
            font-size: 72px;
            display: block;
            animation: bounce 1.6s infinite;
        }

        .result .dog-img {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            display: inline-block;
        }

        .result .dog-name {
            font-size: 1.9rem;
            font-weight: 700;
            margin: 10px 0 4px;
            color: #3a5a85;
        }

        .result .dog-sub {
            font-size: 0.9rem;
            color: #a07d9a;
            margin-bottom: 18px;
        }

        .result .dog-desc {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #4a6688;
            text-align: left;
            background: #eef4fc;
            border-radius: 16px;
            padding: 16px 18px;
            white-space: pre-line;
        }

        .restart-btn {
            margin-top: 24px;
            padding: 14px 34px;
            font-size: 1.05rem;
            color: #fff;
            background: linear-gradient(90deg, var(--pink), var(--peach));
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(91, 155, 255, 0.35);
            transition: transform 0.15s ease;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
        }

        .restart-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="bg-decor" aria-hidden="true">
        <span class="deco paw" style="top:6%;left:6%;font-size:58px;--rot:-12deg;"><svg viewBox="0 0 64 64" fill="currentColor"><ellipse cx="32" cy="42" rx="14" ry="11"/><ellipse cx="13" cy="26" rx="5.5" ry="7.5" transform="rotate(-20 13 26)"/><ellipse cx="25" cy="17" rx="5.5" ry="7.5" transform="rotate(-7 25 17)"/><ellipse cx="39" cy="17" rx="5.5" ry="7.5" transform="rotate(7 39 17)"/><ellipse cx="51" cy="26" rx="5.5" ry="7.5" transform="rotate(20 51 26)"/></svg></span>
        <span class="deco flower" style="top:12%;right:8%;font-size:28px;--rot:10deg;animation-delay:0.8s;">🌸</span>
        <span class="deco paw" style="top:32%;left:3%;font-size:46px;--rot:8deg;animation-delay:1.6s;"><svg viewBox="0 0 64 64" fill="currentColor"><ellipse cx="32" cy="42" rx="14" ry="11"/><ellipse cx="13" cy="26" rx="5.5" ry="7.5" transform="rotate(-20 13 26)"/><ellipse cx="25" cy="17" rx="5.5" ry="7.5" transform="rotate(-7 25 17)"/><ellipse cx="39" cy="17" rx="5.5" ry="7.5" transform="rotate(7 39 17)"/><ellipse cx="51" cy="26" rx="5.5" ry="7.5" transform="rotate(20 51 26)"/></svg></span>
        <span class="deco flower" style="top:46%;right:4%;font-size:24px;--rot:-8deg;animation-delay:0.4s;">🌼</span>
        <span class="deco paw" style="bottom:26%;left:5%;font-size:52px;--rot:14deg;animation-delay:2.1s;"><svg viewBox="0 0 64 64" fill="currentColor"><ellipse cx="32" cy="42" rx="14" ry="11"/><ellipse cx="13" cy="26" rx="5.5" ry="7.5" transform="rotate(-20 13 26)"/><ellipse cx="25" cy="17" rx="5.5" ry="7.5" transform="rotate(-7 25 17)"/><ellipse cx="39" cy="17" rx="5.5" ry="7.5" transform="rotate(7 39 17)"/><ellipse cx="51" cy="26" rx="5.5" ry="7.5" transform="rotate(20 51 26)"/></svg></span>
        <span class="deco flower" style="bottom:12%;right:7%;font-size:30px;--rot:-10deg;animation-delay:1.2s;">🌸</span>
        <span class="deco flower" style="top:68%;left:8%;font-size:22px;--rot:12deg;animation-delay:2.6s;">🌼</span>
        <span class="deco paw" style="bottom:6%;right:12%;font-size:46px;--rot:-14deg;animation-delay:0.2s;"><svg viewBox="0 0 64 64" fill="currentColor"><ellipse cx="32" cy="42" rx="14" ry="11"/><ellipse cx="13" cy="26" rx="5.5" ry="7.5" transform="rotate(-20 13 26)"/><ellipse cx="25" cy="17" rx="5.5" ry="7.5" transform="rotate(-7 25 17)"/><ellipse cx="39" cy="17" rx="5.5" ry="7.5" transform="rotate(7 39 17)"/><ellipse cx="51" cy="26" rx="5.5" ry="7.5" transform="rotate(20 51 26)"/></svg></span>
        <span class="deco flower" style="top:24%;left:18%;font-size:20px;--rot:8deg;animation-delay:1.9s;">🌸</span>
        <span class="deco paw" style="top:58%;right:16%;font-size:42px;--rot:6deg;animation-delay:2.9s;"><svg viewBox="0 0 64 64" fill="currentColor"><ellipse cx="32" cy="42" rx="14" ry="11"/><ellipse cx="13" cy="26" rx="5.5" ry="7.5" transform="rotate(-20 13 26)"/><ellipse cx="25" cy="17" rx="5.5" ry="7.5" transform="rotate(-7 25 17)"/><ellipse cx="39" cy="17" rx="5.5" ry="7.5" transform="rotate(7 39 17)"/><ellipse cx="51" cy="26" rx="5.5" ry="7.5" transform="rotate(20 51 26)"/></svg></span>
    </div>

    <div class="grass" aria-hidden="true"></div>

    <div class="wrap">
        <header>
            <span class="paw">🐾</span>
            <h1>小狗人格测试</h1>
            <p>选出最像你的答案，看看你是哪种小狗吧～</p>
        </header>

        <div class="progress-box">
            <div class="progress-label">
                <span>答题进度</span>
                <span id="progressText">0 / 10</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div id="quiz"></div>

        <div class="result" id="result">
            <span class="emoji" id="resultEmoji"></span>
            <div class="dog-name" id="resultName"></div>
            <div class="dog-sub" id="resultSub"></div>
            <div class="dog-desc" id="resultDesc"></div>
            <button class="restart-btn" onclick="restart()">🔄 重新测试</button>
        </div>
    </div>

    <script>
        // 计分顺序：A=金毛，B=边牧，C=柯基，D=柴犬
        const dogs = [
            {
                name: "金毛",
                emoji: "🦮",
                img: "金毛.jpg",
                sub: "暖心治愈小狗",
                desc: "你是温柔的小太阳，共情力很强，擅长照顾别人情绪。待人真诚友善，很会给身边人提供情绪价值，大家难过的时候第一个想到你。缺点是容易内耗，总优先顾及别人，忘了照顾自己。"
            },
            {
                name: "边牧",
                emoji: "🐕",
                img: "边牧.jpg",
                sub: "聪明规划小狗",
                desc: "观察力拉满，脑子转得很快，擅长分析、规划、拆解问题。喜欢提前想好方案，做事有条理，是团队里的智囊。容易想太多、思虑过重，偶尔会因为事情不按计划走而焦虑。"
            },
            {
                name: "柯基",
                emoji: "🐶",
                img: "柯基.jpg",
                sub: "乐天快乐小狗",
                desc: "天生乐天派，心态松弛，主打活在当下。喜欢热闹，擅长带动气氛，烦恼来得快去得也快。不喜欢复杂沉重的事，很多时候不爱纠结，快乐永远排在第一位。"
            },
            {
                name: "柴犬",
                emoji: "🦊",
                img: "柴犬.jpg",
                sub: "独立有主见小狗",
                desc: "外表看着随和，内心有清晰边界和想法，不讨好、不迎合。慢热，交朋友门槛很高，认定的人会很专一忠诚，不喜欢被强行安排、被管束。"
            }
        ];

        const questions = [
            {
                text: "朋友心情不好来找你倾诉，你会？",
                options: [
                    "耐心陪着安慰，优先照顾对方情绪，哄他开心",
                    "帮他梳理问题，分析原因，给出解决办法",
                    "拉他出去散心、吃好吃的，先把不开心忘掉",
                    "安静陪着，不会过度追问，等他想说再聊"
                ]
            },
            {
                text: "周末空闲时间，你更愿意？",
                options: [
                    "和朋友结伴，轻松陪伴式相处",
                    "提前做好计划，学习、完成任务或者研究新东西",
                    "随便玩，想到啥干啥，主打一个开心摸鱼",
                    "一个人待着，按自己节奏独处，不被打扰"
                ]
            },
            {
                text: "小组合作遇到难题，你习惯？",
                options: [
                    "尽量配合大家，不想发生矛盾，照顾所有人感受",
                    "梳理方案，找出最优思路，安排分工",
                    "活跃气氛，带动大家，缓解紧张氛围",
                    "有自己想法，不轻易妥协，按自己方式来"
                ]
            },
            {
                text: "别人临时改变计划，你的第一反应？",
                options: [
                    "没关系，我可以配合大家",
                    "有点困扰，快速重新调整方案",
                    "无所谓，换个玩法说不定更有意思",
                    "不太喜欢，会觉得打乱自己节奏"
                ]
            },
            {
                text: "你更偏向哪一种夸奖？",
                options: [
                    "“你人好温柔，和你相处很舒服”",
                    "“你思路好清晰，做事很靠谱”",
                    "“你好有趣，跟你在一起很快乐”",
                    "“你很有想法，很有自己的风格”"
                ]
            },
            {
                text: "做一件事的时候，你更看重？",
                options: [
                    "过程里大家的氛围和感受",
                    "效率、逻辑、能不能把事情做好",
                    "好不好玩、有没有意思",
                    "是不是我自己愿意去做"
                ]
            },
            {
                text: "面对陌生的新环境，你会？",
                options: [
                    "友善待人，慢慢和大家熟悉起来",
                    "悄悄观察，快速摸清规则和情况",
                    "很快融入，主动搭话凑热闹",
                    "保持距离，观望，不会主动靠近"
                ]
            },
            {
                text: "当意见和别人不一样时，你会？",
                options: [
                    "尽量迁就，避免争吵",
                    "理性讲道理，说出逻辑，说服对方",
                    "打哈哈带过去，不想争辩",
                    "坚持自己想法，不勉强迎合对方"
                ]
            },
            {
                text: "你更容易因为什么感到疲惫？",
                options: [
                    "接收太多别人的负面情绪",
                    "事情太多、需要不停思考规划",
                    "长时间枯燥、没有乐趣的事情",
                    "被迫社交、被别人管束安排"
                ]
            },
            {
                text: "挑选旅行目的地，你优先选？",
                options: [
                    "舒服治愈、适合放松，适合结伴的地方",
                    "攻略完善、可玩性高，适合打卡探索",
                    "热闹好玩，好吃的多，氛围感强",
                    "小众安静，人少，可以自由闲逛"
                ]
            }
        ];

        const letters = ["A", "B", "C", "D"];
        const total = questions.length;
        const answers = new Array(total).fill(-1);

        const quizEl = document.getElementById("quiz");
        const progressText = document.getElementById("progressText");
        const progressFill = document.getElementById("progressFill");
        const resultEl = document.getElementById("result");

        function renderQuiz() {
            quizEl.innerHTML = "";
            questions.forEach((q, qi) => {
                const card = document.createElement("div");
                card.className = "question";

                const title = document.createElement("div");
                title.className = "q-title";
                title.innerHTML = '<span class="num">' + (qi + 1) + "</span><span>" + q.text + "</span>";
                card.appendChild(title);

                q.options.forEach((opt, oi) => {
                    const btn = document.createElement("button");
                    btn.className = "option";
                    btn.innerHTML = '<span class="tag">' + letters[oi] + "</span>" + opt;
                    btn.addEventListener("click", function () {
                        choose(qi, oi);
                    });
                    card.appendChild(btn);
                });

                quizEl.appendChild(card);
            });
        }

        function choose(qi, oi) {
            answers[qi] = oi;
            updateProgress();
            highlightOptions(qi, oi);

            if (answers.every(function (a) { return a >= 0; })) {
                setTimeout(showResult, 350);
            }
        }

        function highlightOptions(qi, oi) {
            const card = quizEl.children[qi];
            const btns = card.querySelectorAll(".option");
            btns.forEach(function (b, i) {
                b.classList.toggle("selected", i === oi);
            });
        }

        function updateProgress() {
            const done = answers.filter(function (a) { return a >= 0; }).length;
            progressText.textContent = done + " / " + total;
            progressFill.style.width = (done / total * 100) + "%";
        }

        function dogVisual(d) {
            if (d.img) {
                return '<img src="' + d.img + '" alt="' + d.name + '" class="dog-img">';
            }
            return d.emoji;
        }

        function showResult() {
            const counts = [0, 0, 0, 0];
            answers.forEach(function (a) { counts[a]++; });

            let max = Math.max.apply(null, counts);
            const winners = [];
            counts.forEach(function (c, i) { if (c === max) winners.push(i); });

            const resultEmoji = document.getElementById("resultEmoji");
            const resultName = document.getElementById("resultName");
            const resultSub = document.getElementById("resultSub");
            const resultDesc = document.getElementById("resultDesc");

            if (winners.length === 1) {
                const d = dogs[winners[0]];
                resultEmoji.innerHTML = dogVisual(d);
                resultName.textContent = d.name + "型人格";
                resultSub.textContent = d.sub;
                resultDesc.textContent = d.desc;
            } else {
                const names = winners.map(function (i) { return dogs[i].name; }).join(" + ");
                const emojis = winners.map(function (i) { return dogVisual(dogs[i]); }).join(" ");
                const descs = winners.map(function (i) {
                    return dogs[i].name + "（" + dogs[i].sub + "）：" + dogs[i].desc;
                }).join("\n\n");
                resultEmoji.innerHTML = emojis;
                resultName.textContent = names + " 混合型";
                resultSub.textContent = "你身上有两种小狗的影子，很特别哦～";
                resultDesc.textContent = descs;
            }

            resultEl.classList.add("show");
            resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function restart() {
            answers.fill(-1);
            resultEl.classList.remove("show");
            updateProgress();
            renderQuiz();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        renderQuiz();
        updateProgress();
    </script>
</body>
</html>
